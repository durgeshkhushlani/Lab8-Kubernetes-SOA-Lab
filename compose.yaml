services:
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
    depends_on:
      - user-service
      - product-service
      - order-service

  # No "ports:" on any service below - they're reachable by every other container on this Compose
  # network via their service name (e.g. http://user-service:3001), but not from the host machine
  # or the internet. Only api-gateway is published, per the lab's requirement.
  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://user-db:27017/user_service
    depends_on:
      - user-db

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      PORT: 3002
      MONGODB_URI: mongodb://product-db:27017/product_service
    depends_on:
      - product-db

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      PORT: 3003
      MONGODB_URI: mongodb://order-db:27017/order_service
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on:
      - order-db
      - user-service
      - product-service

  user-db:
    image: mongo
    container_name: user-db
    volumes:
      - user-mongo-data:/data/db

  product-db:
    image: mongo
    container_name: product-db
    volumes:
      - product-mongo-data:/data/db

  order-db:
    image: mongo
    container_name: order-db
    volumes:
      - order-mongo-data:/data/db

volumes:
  user-mongo-data:
  product-mongo-data:
  order-mongo-data:
