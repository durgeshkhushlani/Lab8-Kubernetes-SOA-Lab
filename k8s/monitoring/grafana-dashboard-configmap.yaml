apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-lab8
  namespace: lab8
data:
  lab8-dashboard.json: |
    {
      "title": "Lab 8 - Gateway & Microservices",
      "schemaVersion": 36,
      "version": 1,
      "editable": true,
      "time": { "from": "now-15m", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "Targets Up (availability)",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "up{job=~\"api-gateway|user-service|product-service|order-service\"}", "legendFormat": "{{job}}", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_requests_total[1m])) by (job)", "legendFormat": "{{job}}", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Error Rate - 5xx (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "sum(rate(http_requests_total{status=~\"5..\"}[1m])) by (job)", "legendFormat": "{{job}}", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "P95 Latency (seconds)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job))", "legendFormat": "{{job}}", "refId": "A" }
          ]
        }
      ]
    }
