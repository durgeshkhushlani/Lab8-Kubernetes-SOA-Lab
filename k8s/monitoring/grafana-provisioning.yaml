# Pre-provisions Grafana with the Prometheus datasource and the Lab 8 dashboard automatically on
# startup, so there's nothing to click through manually in the Grafana UI beyond logging in.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: lab8
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: lab8
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Lab 8'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
